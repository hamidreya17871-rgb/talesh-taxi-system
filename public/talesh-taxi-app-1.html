<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#123b35"><title>سامانه مدیریت حمل‌ونقل و تاکسیرانی تالش</title><style>
:root{--bg:#f3f6f5;--card:#fff;--ink:#182b28;--muted:#6b7c78;--line:#e0e8e5;--green:#176b57;--green2:#e5f4ee;--gold:#e8b75a;--red:#b94343;--shadow:0 8px 25px #163c3210}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,"Vazirmatn",Arial,sans-serif;font-size:14px}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.side{width:250px;background:#123b35;color:#eaf4f1;padding:22px 14px;flex-shrink:0}.brand{display:flex;align-items:center;gap:12px;padding:5px 8px 24px;border-bottom:1px solid #ffffff22}.logo{width:44px;height:44px;border-radius:14px;background:#e8b75a;color:#123b35;display:grid;place-items:center;font-size:23px;font-weight:bold}.brand b{display:block;font-size:14px;line-height:1.9}.brand small{color:#b7d2ca}.nav{padding-top:18px}.nav button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;color:#c4d9d3;text-align:right;padding:12px 13px;border-radius:11px;margin:3px 0}.nav button.active,.nav button:hover{background:#ffffff18;color:#fff}.nav .ico{width:22px;text-align:center;font-size:18px}.main{flex:1;min-width:0}.top{height:75px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;gap:12px}.top h1{font-size:18px;margin:0}.top small{color:var(--muted)}.user{display:flex;align-items:center;gap:10px}.avatar{background:var(--green2);color:var(--green);width:39px;height:39px;border-radius:50%;display:grid;place-items:center;font-weight:bold}.content{padding:26px;max-width:1500px;margin:auto}.welcome{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:23px}.welcome h2{font-size:22px;margin:0 0 8px}.welcome p{color:var(--muted);margin:0}.btn{border:0;border-radius:10px;padding:11px 15px;background:var(--green);color:#fff;font-weight:bold}.btn:hover{filter:brightness(.95)}.btn.secondary{background:#edf4f1;color:var(--green)}.btn.danger{background:#fff0f0;color:var(--red)}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:22px}.stat,.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.stat{padding:19px;display:flex;align-items:center;justify-content:space-between;gap:12px}.stat small{color:var(--muted)}.stat strong{display:block;font-size:27px;margin-top:10px}.stat .badgeicon{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--green2);font-size:22px}.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:17px}.panel{padding:20px;margin-bottom:17px;min-width:0}.panelhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:17px}.panelhead h3{margin:0;font-size:16px}.muted{color:var(--muted)}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}th,td{text-align:right;padding:13px 10px;border-bottom:1px solid var(--line)}th{font-size:12px;color:var(--muted);font-weight:normal;background:#f8faf9}tbody tr:last-child td{border-bottom:0}.status{display:inline-block;border-radius:20px;padding:5px 9px;font-size:11px;background:#e5f4ee;color:#176b57}.status.warn{background:#fff4dc;color:#94650d}.status.bad{background:#ffeded;color:#b94343}.empty{text-align:center;padding:30px;color:var(--muted)}.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.quick button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:15px;text-align:right;color:var(--ink)}.quick button span{display:block;font-size:21px;margin-bottom:9px}.quick button small{color:var(--muted)}.notice{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}.notice:last-child{border:0}.notice .dot{width:9px;height:9px;border-radius:50%;background:var(--gold);margin-top:5px;flex-shrink:0}.pagehead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.pagehead h2{margin:0;font-size:21px}.tools{display:flex;gap:9px;flex-wrap:wrap}.search{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:white;min-width:200px}.modalback{position:fixed;inset:0;background:#0b2824a6;display:none;align-items:center;justify-content:center;padding:18px;z-index:5}.modalback.show{display:flex}.modal{background:#fff;border-radius:18px;padding:23px;width:min(560px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 70px #0003}.modal h3{margin:0 0 18px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:var(--muted)}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #d8e2de;border-radius:9px;background:#fff;outline-color:var(--green)}.field textarea{min-height:75px;resize:vertical}.modalactions{display:flex;justify-content:flex-start;gap:8px;margin-top:20px}.rowactions{display:flex;gap:5px}.tiny{border:0;border-radius:7px;padding:6px 9px;background:#edf4f1;color:var(--green)}.tiny.del{background:#fff0f0;color:var(--red)}.mobilebar{display:none}.foot{font-size:11px;color:var(--muted);text-align:center;padding:18px}.toast{position:fixed;bottom:20px;left:20px;background:#123b35;color:#fff;padding:12px 18px;border-radius:10px;display:none;z-index:10}.toast.show{display:block}@media(max-width:1000px){.stats{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.side{width:220px}.content{padding:18px}}@media(max-width:650px){.app{display:block}.side{display:none}.top{height:64px;padding:0 15px}.top h1{font-size:14px}.top small{display:none}.content{padding:15px 12px 85px}.welcome{align-items:flex-start}.welcome h2{font-size:18px}.welcome p{font-size:12px;line-height:1.8}.welcome>.btn{display:none}.stats{gap:9px}.stat{padding:13px}.stat strong{font-size:22px}.stat .badgeicon{width:36px;height:36px;font-size:18px}.panel{padding:14px}.pagehead{align-items:flex-start;flex-direction:column}.tools{width:100%}.search{flex:1;min-width:0}.fields{grid-template-columns:1fr}.field.full{grid-column:auto}.mobilebar{display:flex;position:fixed;bottom:0;right:0;left:0;background:#fff;border-top:1px solid var(--line);padding:7px 4px calc(7px + env(safe-area-inset-bottom));justify-content:space-around;z-index:3}.mobilebar button{border:0;background:transparent;color:#6b7c78;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:5px 4px}.mobilebar button span{font-size:19px}.mobilebar button.active{color:var(--green);font-weight:bold}.user .role{display:none}.quick{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="app"><aside class="side"><div class="brand"><div class="logo">ت</div><div><b>تاکسیرانی تالش</b><small>سامانه مدیریت حمل‌ونقل</small></div></div><nav class="nav" id="sidenav"></nav></aside><main class="main"><header class="top"><div><h1 id="topTitle">داشبورد مدیریتی</h1><small>سامانه مدیریت حمل‌ونقل و تاکسیرانی تالش</small></div><div class="user"><div class="avatar">م</div><div class="role"><b>مدیریت سامانه</b><br><small>نسخه محلی</small></div></div></header><div class="content" id="content"></div><div class="foot">سامانه مدیریت حمل‌ونقل و تاکسیرانی تالش · نسخه مستقل قابل اجرا روی موبایل</div></main></div><nav class="mobilebar" id="mobilebar"></nav><div class="modalback" id="modalback"><div class="modal"><h3 id="modaltitle">افزودن مورد</h3><form id="itemform"><div class="fields" id="formfields"></div><div class="modalactions"><button class="btn" type="submit">ذخیره</button><button class="btn secondary" type="button" onclick="closeModal()">انصراف</button></div></form></div></div><div class="toast" id="toast"></div>
<script>
const menus=[['dashboard','▦','داشبورد'],['drivers','♙','رانندگان'],['vehicles','▣','خودروها'],['licenses','▤','مجوزها و پروانه‌ها'],['documents','▧','مدارک'],['reminders','◷','یادآوری‌ها'],['violations','⚑','تخلفات'],['settings','⚙','پشتیبان‌گیری']];
const configs={drivers:{title:'رانندگان',singular:'راننده',icon:'♙',fields:[['name','نام و نام خانوادگی','text',1],['national','کد ملی','text'],['phone','شماره تماس','tel'],['license','شماره گواهینامه','text'],['route','خط / مسیر','text'],['status','وضعیت','select',['فعال','در انتظار بررسی','غیرفعال']],['notes','توضیحات','textarea',1]],cols:[['name','نام راننده'],['national','کد ملی'],['phone','تماس'],['route','مسیر'],['status','وضعیت']]},vehicles:{title:'خودروها',singular:'خودرو',icon:'▣',fields:[['plate','شماره پلاک','text',1],['model','نوع / مدل خودرو','text'],['driver','راننده','text'],['year','سال ساخت','number'],['insurance','انقضای بیمه','date'],['inspection','معاینه فنی تا','date'],['status','وضعیت','select',['فعال','نیازمند بررسی','غیرفعال']],['notes','توضیحات','textarea',1]],cols:[['plate','پلاک'],['model','مدل'],['driver','راننده'],['insurance','انقضای بیمه'],['status','وضعیت']]},licenses:{title:'مجوزها و پروانه‌ها',singular:'مجوز',icon:'▤',fields:[['kind','نوع مجوز','text',1],['number','شماره مجوز','text'],['owner','نام دارنده','text'],['issued','تاریخ صدور','date'],['expires','تاریخ انقضا','date'],['status','وضعیت','select',['معتبر','در حال بررسی','منقضی']],['notes','توضیحات','textarea',1]],cols:[['kind','نوع مجوز'],['number','شماره'],['owner','دارنده'],['expires','انقضا'],['status','وضعیت']]},documents:{title:'مدارک',singular:'مدرک',icon:'▧',fields:[['title','عنوان مدرک','text',1],['person','مرتبط با (راننده/خودرو)','text'],['number','شماره مدرک','text'],['expires','تاریخ انقضا','date'],['status','وضعیت','select',['کامل','ناقص','نیازمند تمدید']],['notes','توضیحات','textarea',1]],cols:[['title','مدرک'],['person','مرتبط با'],['number','شماره'],['expires','انقضا'],['status','وضعیت']]},reminders:{title:'یادآوری‌ها',singular:'یادآوری',icon:'◷',fields:[['title','عنوان یادآوری','text',1],['date','تاریخ یادآوری','date'],['category','دسته‌بندی','select',['بیمه','معاینه فنی','مجوز','مدارک','سایر']],['status','وضعیت','select',['باز','انجام‌شده']],['notes','توضیحات','textarea',1]],cols:[['title','عنوان'],['date','تاریخ'],['category','دسته‌بندی'],['status','وضعیت']]},violations:{title:'تخلفات',singular:'تخلف',icon:'⚑',fields:[['date','تاریخ ثبت','date'],['plate','شماره پلاک','text'],['driver','نام راننده','text'],['kind','نوع تخلف','text',1],['amount','مبلغ جریمه (تومان)','number'],['status','وضعیت رسیدگی','select',['ثبت‌شده','در حال بررسی','مختومه']],['notes','شرح تخلف','textarea',1]],cols:[['date','تاریخ'],['plate','پلاک'],['driver','راننده'],['kind','نوع تخلف'],['amount','مبلغ'],['status','وضعیت']]}};
let db=loadDB(),page='dashboard',editing=null,query='';function loadDB(){try{return JSON.parse(localStorage.getItem('taleshTaxiDB'))||{drivers:[],vehicles:[],licenses:[],documents:[],reminders:[],violations:[]}}catch(e){return {drivers:[],vehicles:[],licenses:[],documents:[],reminders:[],violations:[]}}}function saveDB(){localStorage.setItem('taleshTaxiDB',JSON.stringify(db))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmt(n){return Number(n||0).toLocaleString('fa-IR')}function statusClass(s){if(/منقضی|ناقص|غیرفعال|نیازمند/.test(s||''))return'bad';if(/بررسی|انتظار|باز|ثبت‌شده/.test(s||''))return'warn';return''}function badge(s){return `<span class="status ${statusClass(s)}">${esc(s||'—')}</span>`}function today(){return new Date().toISOString().slice(0,10)}function expired(x){return x&&x<today()}function nav(){let html=menus.map(([id,ic,label])=>`<button class="${page===id?'active':''}" onclick="go('${id}')"><span class="ico">${ic}</span>${label}</button>`).join('');document.getElementById('sidenav').innerHTML=html;document.getElementById('mobilebar').innerHTML=menus.filter(x=>['dashboard','drivers','vehicles','reminders','settings'].includes(x[0])).map(([id,ic,label])=>`<button class="${page===id?'active':''}" onclick="go('${id}')"><span>${ic}</span>${label}</button>`).join('')}
function go(p){page=p;query='';nav();render()}function render(){const c=document.getElementById('content');document.getElementById('topTitle').textContent=menus.find(x=>x[0]===page)?.[2]||'داشبورد';if(page==='dashboard')c.innerHTML=dashboard();else if(page==='settings')c.innerHTML=settings();else c.innerHTML=listing(page);}
function dashboard(){let due=0;['vehicles','licenses','documents'].forEach(k=>db[k].forEach(x=>{if(expired(x.insurance)||expired(x.inspection)||expired(x.expires))due++}));let open=db.reminders.filter(x=>x.status!=='انجام‌شده').length;let recent=[...db.drivers.map(x=>({...x,_kind:'راننده',_key:'drivers',_name:x.name||'راننده'})),...db.vehicles.map(x=>({...x,_kind:'خودرو',_key:'vehicles',_name:x.plate||'خودرو'}))].slice(-5).reverse();return `<div class="welcome"><div><h2>خوش آمدید 👋</h2><p>نمای کلی وضعیت ناوگان و اطلاعات تاکسیرانی تالش</p></div><button class="btn" onclick="go('drivers')">＋ ثبت راننده</button></div><div class="stats">${[['♙','رانندگان',db.drivers.length],['▣','خودروها',db.vehicles.length],['▤','مجوزها',db.licenses.length],['◷','یادآوری باز',open]].map(([ic,t,n])=>`<div class="stat"><div><small>${t}</small><strong>${fmt(n)}</strong></div><div class="badgeicon">${ic}</div></div>`).join('')}</div><div class="grid2"><section class="panel"><div class="panelhead"><h3>دسترسی سریع</h3><span class="muted">مدیریت اطلاعات</span></div><div class="quick">${[['drivers','♙','ثبت راننده','اطلاعات و وضعیت رانندگان'],['vehicles','▣','ثبت خودرو','پلاک و وضعیت بیمه'],['documents','▧','مدیریت مدارک','مدارک و تاریخ انقضا'],['reminders','◷','یادآوری جدید','پیگیری موعدها'],['licenses','▤','مجوزها','پروانه و مجوز فعالیت'],['violations','⚑','ثبت تخلف','سوابق تخلفات']].map(([id,ic,t,d])=>`<button onclick="go('${id}')"><span>${ic}</span><b>${t}</b><br><small>${d}</small></button>`).join('')}</div></section><section><div class="panel"><div class="panelhead"><h3>یادآوری‌های باز</h3><button class="btn secondary" onclick="go('reminders')">مشاهده همه</button></div>${db.reminders.filter(x=>x.status!=='انجام‌شده').slice(0,5).map(x=>`<div class="notice"><div class="dot"></div><div><b>${esc(x.title)}</b><br><small class="muted">${esc(x.date||'بدون تاریخ')} · ${esc(x.category||'عمومی')}</small></div></div>`).join('')||'<div class="empty">یادآوری بازی ثبت نشده است.</div>'}</div><div class="panel"><div class="panelhead"><h3>وضعیت اطلاعات</h3></div><div class="notice"><div class="dot"></div><div><b>${fmt(db.vehicles.length)} خودرو</b><br><small class="muted">در سامانه ثبت شده</small></div></div><div class="notice"><div class="dot"></div><div><b>${fmt(due)} مورد دارای تاریخ منقضی</b><br><small class="muted">بر اساس تاریخ‌های واردشده</small></div></div><small class="muted">توجه: داده‌ها فعلاً فقط روی همین دستگاه ذخیره می‌شوند.</small></div></section></div>`}
function listing(k){let cfg=configs[k],rows=db[k]||[];let filtered=rows.filter(x=>Object.values(x).join(' ').toLowerCase().includes(query.toLowerCase()));return `<div class="pagehead"><div><h2>${cfg.title}</h2><small class="muted">ثبت و مدیریت ${cfg.singular}‌ها · ${fmt(rows.length)} مورد</small></div><button class="btn" onclick="openModal('${k}')">＋ افزودن ${cfg.singular}</button></div><section class="panel"><div class="panelhead"><h3>فهرست ${cfg.title}</h3><div class="tools"><input class="search" placeholder="جستجو در فهرست…" value="${esc(query)}" oninput="query=this.value;const y=window.scrollY;render();window.scrollTo(0,y)"><button class="btn secondary" onclick="exportCSV('${k}')">خروجی CSV</button></div></div><div class="tablewrap"><table><thead><tr>${cfg.cols.map(x=>`<th>${x[1]}</th>`).join('')}<th>عملیات</th></tr></thead><tbody>${filtered.map(x=>`<tr>${cfg.cols.map(([key,label])=>`<td>${key==='status'?badge(x[key]):key==='amount'?fmt(x[key]):esc(x[key]||'—')}</td>`).join('')}<td><div class="rowactions"><button class="tiny" onclick="openModal('${k}','${x.id}')">ویرایش</button><button class="tiny del" onclick="removeItem('${k}','${x.id}')">حذف</button></div></td></tr>`).join('')||`<tr><td colspan="${cfg.cols.length+1}" class="empty">${query?'موردی مطابق جستجو پیدا نشد.':'هنوز موردی ثبت نشده است. برای شروع روی «افزودن» بزنید.'}</td></tr>`}</tbody></table></div></section>`}
function settings(){return `<div class="welcome"><div><h2>تنظیمات و پشتیبان‌گیری</h2><p>مدیریت فایل اطلاعات این دستگاه</p></div></div><div class="grid2"><section class="panel"><h3>پشتیبان‌گیری از اطلاعات</h3><p class="muted">یک فایل JSON شامل رانندگان، خودروها، مجوزها، مدارک، یادآوری‌ها و تخلفات ذخیره می‌شود.</p><button class="btn" onclick="backup()">دریافت نسخه پشتیبان</button><hr style="border:0;border-top:1px solid var(--line);margin:22px 0"><h3>بازیابی اطلاعات</h3><p class="muted">فایل پشتیبان قبلی را انتخاب کنید. اطلاعات فعلی با اطلاعات فایل جایگزین می‌شود.</p><input type="file" id="restorefile" accept=".json,application/json"><br><br><button class="btn secondary" onclick="restore()">بازیابی فایل</button></section><section class="panel"><h3>وضعیت نسخه</h3><div class="notice"><div class="dot"></div><div><b>نسخه مستقل و قابل اجرا</b><br><small class="muted">بدون نیاز به حساب کاربری یا اینترنت برای کارکردهای محلی</small></div></div><div class="notice"><div class="dot"></div><div><b>ذخیره‌سازی محلی</b><br><small class="muted">اطلاعات در مرورگر همین دستگاه می‌ماند؛ پاک‌کردن داده‌های مرورگر ممکن است آن را حذف کند.</small></div></div><div class="notice"><div class="dot"></div><div><b>اتصال آنلاین فعال نیست</b><br><small class="muted">برای استفاده مشترک چند کاربره باید سرور و پایگاه داده تنظیم شود.</small></div></div><button class="btn danger" onclick="clearAll()">پاک‌کردن همه اطلاعات</button></section></div>`}
function openModal(k,id=null){editing={k,id};let cfg=configs[k],old=id?db[k].find(x=>x.id===id):{};document.getElementById('modaltitle').textContent=(id?'ویرایش ':'افزودن ')+cfg.singular;document.getElementById('formfields').innerHTML=cfg.fields.map(([key,label,type,extra])=>{let val=old?.[key]??'';let inp=type==='select'?`<select name="${key}">${extra.map(v=>`<option ${val===v?'selected':''}>${v}</option>`).join('')}</select>`:type==='textarea'?`<textarea name="${key}">${esc(val)}</textarea>`:`<input name="${key}" type="${type}" value="${esc(val)}" ${extra===1?'required':''}>`;return `<div class="field ${extra===1?'full':''}"><label>${label}</label>${inp}</div>`}).join('');document.getElementById('modalback').classList.add('show')}function closeModal(){document.getElementById('modalback').classList.remove('show')}document.getElementById('itemform').addEventListener('submit',e=>{e.preventDefault();let{k,id}=editing,cfg=configs[k],data=Object.fromEntries(new FormData(e.target));if(id){let i=db[k].findIndex(x=>x.id===id);db[k][i]={...db[k][i],...data}}else{db[k].push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),...data,createdAt:new Date().toISOString()})}saveDB();closeModal();render();toast('اطلاعات با موفقیت ذخیره شد')});function removeItem(k,id){if(!confirm('این مورد حذف شود؟'))return;db[k]=db[k].filter(x=>x.id!==id);saveDB();render();toast('مورد حذف شد')}function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}function exportCSV(k){let cfg=configs[k],rows=db[k];let lines=[cfg.cols.map(x=>x[1]).join(','),...rows.map(r=>cfg.cols.map(([key])=>'"'+String(r[key]??'').replaceAll('"','""')+'"').join(','))];download(new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}),k+'-talesh.csv')}function backup(){download(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),'talesh-taxi-backup-'+today()+'.json');toast('نسخه پشتیبان آماده شد')}function restore(){let f=document.getElementById('restorefile').files[0];if(!f){toast('ابتدا فایل پشتیبان را انتخاب کنید');return}let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!confirm('اطلاعات فعلی جایگزین شود؟'))return;for(let k of Object.keys(configs))if(Array.isArray(d[k]))db[k]=d[k];saveDB();render();toast('بازیابی انجام شد')}catch(e){toast('فایل پشتیبان معتبر نیست')}};r.readAsText(f)}function download(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}function clearAll(){if(!confirm('همه اطلاعات این سامانه از این دستگاه حذف شود؟ این کار برگشت‌پذیر نیست.'))return;Object.keys(configs).forEach(k=>db[k]=[]);saveDB();render();toast('اطلاعات پاک شد')}document.getElementById('modalback').addEventListener('click',e=>{if(e.target.id==='modalback')closeModal()});nav();render();
</script></body></html>
