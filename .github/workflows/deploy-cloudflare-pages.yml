name: Deploy web to Cloudflare Pages

on:
  push:
    branches: [release/standalone-railway]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate production configuration
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_PWA_HOSTS: talesh-taxi-system.pages.dev,web-application-deve-0r9y.bolt.host
        run: |
          test -n "$VITE_SUPABASE_URL" || (echo "::error::Set GitHub Actions secret VITE_SUPABASE_URL"; exit 1)
          test -n "$VITE_SUPABASE_ANON_KEY" || (echo "::error::Set GitHub Actions secret VITE_SUPABASE_ANON_KEY"; exit 1)
          echo "VITE_SUPABASE_URL=$VITE_SUPABASE_URL" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_ANON_KEY=$VITE_SUPABASE_ANON_KEY" >> "$GITHUB_ENV"
          echo "VITE_PWA_HOSTS=$VITE_PWA_HOSTS" >> "$GITHUB_ENV"
      - name: Build production web app
        run: npm run build
      - name: Deploy Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "::error::Set GitHub Actions secret CLOUDFLARE_API_TOKEN"; exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "::error::Set GitHub Actions secret CLOUDFLARE_ACCOUNT_ID"; exit 1)
          npx --yes wrangler@4 pages deploy dist --project-name=talesh-taxi-system --branch=release/standalone-railway
