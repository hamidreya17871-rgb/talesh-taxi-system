name: CI

on:
  push:
    branches: [main, 'feature/**', 'release/**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Dependency vulnerability report
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const a=require('./npm-audit.json'); const rows=Object.entries(a.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,range:v.range,fixAvailable:v.fixAvailable,via:(v.via||[]).map(x=>typeof x==='string'?x:x.title)})); console.log(JSON.stringify({summary:a.metadata?.vulnerabilities,packages:rows},null,2))"
      # Block releases on vulnerable runtime dependencies. The full audit above
      # still reports development-toolchain findings without skipping build checks.
      - name: Enforce production dependency security audit
        run: npm audit --omit=dev --audit-level=moderate
      - name: Check production server syntax
        run: node --check server.mjs
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Smoke test production server
        run: |
          npm run start > /tmp/talesh-taxi-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          HEALTHY=false
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/healthz; then
              HEALTHY=true
              echo
              break
            fi
            sleep 1
          done
          test "$HEALTHY" = true
          curl --fail --silent --show-error -D /tmp/talesh-headers.txt http://127.0.0.1:3000/ -o /tmp/talesh-index.html
          grep -qi '^content-type: text/html' /tmp/talesh-headers.txt
          grep -q '<div id="root"></div>' /tmp/talesh-index.html
          ASSET=$(grep -oE '/assets/[^"]+\.js' /tmp/talesh-index.html | head -n 1)
          test -n "$ASSET"
          curl --fail --silent --show-error "http://127.0.0.1:3000$ASSET" >/dev/null
