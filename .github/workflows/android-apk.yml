name: Android APK and Google Play bundle

on:
  push:
    branches: [release/android-branding-googleplay-20261118]
  pull_request:
    branches: [release/standalone-railway]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install web dependencies
        run: npm ci
      - name: Install Capacitor and image asset tools
        run: npm install --no-save --package-lock=false @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/assets@latest sharp
      - name: Build web application
        run: npm run build
      - name: Verify production web bundle
        run: |
          test -s dist/index.html
          grep -q 'سامانه مدیریت حمل‌ونقل و تاکسیرانی تالش' dist/index.html
      - name: Generate Android launcher icons from the existing Talesh taxi artwork
        run: |
          mkdir -p assets
          node --input-type=module <<'EOF'
          import sharp from 'sharp';
          await sharp('public/app-icon.svg').resize(1024, 1024, { fit: 'contain', background: '#ffffff' }).png().toFile('assets/icon.png');
          EOF
          npx capacitor-assets generate --android --iconBackgroundColor '#ffffff'
      - name: Generate Capacitor Android project
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "ir.talesh.taxi",
            "appName": "تاکسیرانی تالش",
            "webDir": "dist",
            "server": { "androidScheme": "https" }
          }
          EOF
          npx cap add android
          npx cap sync android
      - name: Build installable debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Build Google Play Android App Bundle
        run: |
          cd android
          ./gradlew --no-daemon bundleRelease
          test -s app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: talesh-taxi-android-package
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
