name: Android APK
# Trigger a fresh release build from the Android preparation branch after signing secrets are configured.

on:
  push:
    branches:
      - release/android-production-sync-20261128
  pull_request:
    branches:
      - release/standalone-railway
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install web dependencies
        run: npm ci
      - name: Install Capacitor toolchain
        run: npm install --no-save --package-lock=false @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 sharp
      - name: Build production web application
        run: npm run build
      - name: Verify production web bundle
        run: |
          test -s dist/index.html
          grep -q 'سامانه مدیریت حمل‌ونقل و تاکسیرانی تالش' dist/index.html
      - name: Generate Capacitor Android project
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "ir.talesh.taxi",
            "appName": "تاکسیرانی تالش",
            "webDir": "dist",
            "server": { "androidScheme": "https" }
          }
          EOF
          npx cap add android
          npx cap sync android
      - name: Set Android release version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          s2 = s.replace("versionCode 1", "versionCode 2", 1).replace('versionName "1.0"', 'versionName "1.0.1"', 1)
          if s2 == s:
              raise SystemExit("Could not safely locate the generated Android version fields")
          p.write_text(s2)
          PY
      - name: Install the app launcher icon in Android resources
        run: |
          node --input-type=module <<'NODE'
          import sharp from 'sharp';
          import { mkdir, writeFile } from 'node:fs/promises';
          import { join } from 'node:path';

          const source = 'public/icons/icon-512.png';
          const androidRes = 'android/app/src/main/res';
          const densities = { mdpi: 48, hdpi: 72, xhdpi: 96, xxhdpi: 144, xxxhdpi: 192 };

          for (const [density, size] of Object.entries(densities)) {
            const dir = join(androidRes, `mipmap-${density}`);
            await mkdir(dir, { recursive: true });
            await sharp(source).resize(size, size, { fit: 'contain' }).png().toFile(join(dir, 'ic_launcher.png'));
            await sharp(source).resize(size, size, { fit: 'contain' }).png().toFile(join(dir, 'ic_launcher_round.png'));
          }

          const adaptiveDir = join(androidRes, 'mipmap-anydpi-v26');
          await mkdir(adaptiveDir, { recursive: true });
          const foregroundDir = join(androidRes, 'drawable');
          await mkdir(foregroundDir, { recursive: true });
          await sharp(source)
            .resize(432, 432, { fit: 'contain' })
            .extend({ top: 40, bottom: 40, left: 40, right: 40, background: { r: 0, g: 0, b: 0, alpha: 0 } })
            .png()
            .toFile(join(foregroundDir, 'ic_launcher_foreground.png'));

          const adaptive = `<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          `;
          await writeFile(join(adaptiveDir, 'ic_launcher.xml'), adaptive);
          await writeFile(join(adaptiveDir, 'ic_launcher_round.xml'), adaptive);
          const valuesDir = join(androidRes, 'values');
          await mkdir(valuesDir, { recursive: true });
          await writeFile(join(valuesDir, 'ic_launcher_background.xml'),
            `<?xml version="1.0" encoding="utf-8"?>\n<resources><color name="ic_launcher_background">#FFFFFF</color></resources>\n`);
          NODE
      - name: Bind launcher icons in Android manifest and verify resources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if not manifest.is_file():
              raise SystemExit("Generated AndroidManifest.xml is missing")
          tree = ET.parse(manifest)
          root = tree.getroot()
          android_ns = "http://schemas.android.com/apk/res/android"
          app = root.find("application")
          if app is None:
              raise SystemExit("Android manifest has no application element")

          # Explicitly point Android at the launcher resources generated above.
          app.set(f"{{{android_ns}}}icon", "@mipmap/ic_launcher")
          app.set(f"{{{android_ns}}}roundIcon", "@mipmap/ic_launcher_round")
          tree.write(manifest, encoding="utf-8", xml_declaration=True)

          res = Path("android/app/src/main/res")
          required = [
              res / "mipmap-mdpi/ic_launcher.png",
              res / "mipmap-hdpi/ic_launcher.png",
              res / "mipmap-xhdpi/ic_launcher.png",
              res / "mipmap-xxhdpi/ic_launcher.png",
              res / "mipmap-xxxhdpi/ic_launcher.png",
              res / "mipmap-anydpi-v26/ic_launcher.xml",
              res / "mipmap-anydpi-v26/ic_launcher_round.xml",
              res / "drawable/ic_launcher_foreground.png",
              res / "values/ic_launcher_background.xml",
          ]
          missing = [str(p) for p in required if not p.is_file() or p.stat().st_size == 0]
          if missing:
              raise SystemExit("Launcher resources missing: " + ", ".join(missing))

          check = ET.parse(manifest).getroot().find("application")
          assert check.get(f"{{{android_ns}}}icon") == "@mipmap/ic_launcher"
          assert check.get(f"{{{android_ns}}}roundIcon") == "@mipmap/ic_launcher_round"
          print("Launcher manifest references and all icon resources verified.")
          PY
      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Sign release APK when signing secrets are configured
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED="android/app/build/outputs/apk/release/talesh-taxi-release-signed.apk"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/talesh-taxi-release.jks"
            test -s "$RUNNER_TEMP/talesh-taxi-release.jks"
            KEY_PASSWORD="$ANDROID_KEY_PASSWORD"
            if [ -z "$KEY_PASSWORD" ]; then
              KEY_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
            fi
            export KEY_PASSWORD
            APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
            test -x "$APKSIGNER"
            "$APKSIGNER" sign \
              --ks "$RUNNER_TEMP/talesh-taxi-release.jks" \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
              --key-pass env:KEY_PASSWORD \
              --out "$SIGNED" "$UNSIGNED"
            "$APKSIGNER" verify --verbose --print-certs "$SIGNED" | tee "$RUNNER_TEMP/apk-certificate.txt"
            CERT_SHA256="$(sed -n 's/.*SHA-256 digest: //p' "$RUNNER_TEMP/apk-certificate.txt" | tr -d ':' | tr '[:upper:]' '[:lower:]' | head -n 1)"
            test "$CERT_SHA256" = "36cdc80a7a1bf269d33d2c3f031d1be7b5d75cfe52db1bdfab2e8b72efa3f172"
            echo "APK_KIND=signed" >> "$GITHUB_ENV"
            echo "APK_PATH=$SIGNED" >> "$GITHUB_ENV"
          else
            echo "Signing secrets are not configured; publishing an explicitly unsigned test artifact."
            echo "APK_KIND=unsigned-test-only" >> "$GITHUB_ENV"
            echo "APK_PATH=$UNSIGNED" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: talesh-taxi-android-${{ env.APK_KIND }}
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14
