name: One-time dependency security remediation

on:
  push:
    branches: [feature/administrative-workflows]

concurrency:
  group: dependency-remediation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply compatible security updates
        run: npm audit fix || true
      - name: Record remaining advisory summary
        run: |
          npm audit --json > npm-audit-after-fix.json || true
          node -e "const a=require('./npm-audit-after-fix.json'); console.log(JSON.stringify({summary:a.metadata?.vulnerabilities,packages:Object.entries(a.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,range:v.range,fixAvailable:v.fixAvailable}))},null,2))"
      - name: Verify type safety
        run: npm run typecheck
      - name: Verify lint
        run: npm run lint
      - name: Verify production build
        run: npm run build
      - name: Commit lockfile remediation
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix: remediate npm dependency vulnerabilities"
          git push origin HEAD:feature/administrative-workflows
