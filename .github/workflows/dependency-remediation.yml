name: One-time dependency remediation

on:
  push:
    branches: ['release/**']

permissions:
  contents: write

jobs:
  remediate:
    if: github.event.head_commit.message == 'Trigger one-time dependency remediation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply compatible security fixes
        run: npm audit fix
      - name: Verify dependency audit
        run: npm audit --audit-level=moderate
      - name: Verify application
        run: |
          node --check server.mjs
          npm run typecheck
          npm run lint
          npm run build
      - name: Smoke test production server
        run: |
          npm run start > /tmp/talesh-taxi-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:3000/healthz; then
              echo
              curl --fail --silent http://127.0.0.1:3000/ >/dev/null
              exit 0
            fi
            sleep 1
          done
          cat /tmp/talesh-taxi-server.log
          exit 1
      - name: Commit updated dependency lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm RUN_NPM_AUDIT_FIX
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(deps): remediate npm audit findings"
            git push
          fi
