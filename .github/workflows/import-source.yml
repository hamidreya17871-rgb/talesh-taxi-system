name: Import taxi system source

on:
  push:
    paths:
      - "talesh-taxi-install-ready-v3(2).zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project source
        shell: bash
        run: |
          ARCHIVE="talesh-taxi-install-ready-v3(2).zip"
          if [ ! -f "$ARCHIVE" ]; then
            echo "Upload $ARCHIVE to the repository root first."
            exit 1
          fi
          mkdir -p /tmp/talesh-source
          unzip -q "$ARCHIVE" -d /tmp/talesh-source
          cp -a /tmp/talesh-source/. .
          rm -f "$ARCHIVE" .env.production
          touch .gitignore
          grep -qxF '.env*' .gitignore || printf '\n.env*\n' >> .gitignore
          grep -qxF '!.env.example' .gitignore || printf '!.env.example\n' >> .gitignore
          git status --short

      - name: Commit imported source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add -A
          git commit -m "Import Talesh taxi system source" || echo "No changes to commit"
          git push

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
